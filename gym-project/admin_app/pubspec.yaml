name: gym_admin_app
description: >
  Aplicación administrativa de escritorio (Flutter Desktop / Windows) para el
  sistema de gestión de gimnasio. Consumida exclusivamente por el
  administrador y personal autorizado.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  fl_chart: ^0.68.0
  intl: ^0.19.0

  # Paquete local compartido con la app móvil (modelos, tema, cliente HTTP).
  # Ruta relativa: asume que admin_app/ y shared_models/ son carpetas
  # hermanas dentro del mismo repositorio.
  shared_models:
    path: ../shared_models

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
